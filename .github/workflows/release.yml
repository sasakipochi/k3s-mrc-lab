# v* タグを push すると、mrc-fabric イメージ (amd64/arm64) を ghcr.io に公開する
#   ghcr.io/<owner>/mrc-fabric:<version>  (タグと k8s/fabric/fabric.yaml のイメージのバージョンが一致していること)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest
        id: ver
        run: |
          tag=${GITHUB_REF_NAME#v}
          img=$(sed -n 's#.*image: ghcr.io/.*/mrc-fabric:\(.*\)#\1#p' k8s/fabric/fabric.yaml)
          if [ "$tag" != "$img" ]; then
            echo "::error::tag v$tag does not match k8s/fabric/fabric.yaml ($img)"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: fabric
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/mrc-fabric:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ver.outputs.owner }}/mrc-fabric:latest
