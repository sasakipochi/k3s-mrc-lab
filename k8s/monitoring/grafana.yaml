# Grafana (匿名 Viewer で閲覧可)
#   admin のパスワード: Secret grafana-admin があればそれ (make monitoring が生成)。
#   無ければ起動のたびにランダムに作り、/var/lib/grafana/admin-password に置く (既定の admin/admin では起動しない)
#     kubectl -n mrc-lab exec deploy/grafana -- cat /var/lib/grafana/admin-password
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prom
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData: {timeInterval: 2s}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mrc-lab
        type: file
        options: {path: /var/lib/grafana/dashboards/mrc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3      # netmon と同じ
          command:
            - sh
            - -c
            - |
              if [ -z "$GF_SECURITY_ADMIN_PASSWORD" ]; then
                umask 077
                head -c 18 /dev/urandom | base64 | tr -d '/+=' > /var/lib/grafana/admin-password
                export GF_SECURITY_ADMIN_PASSWORD="$(cat /var/lib/grafana/admin-password)"
              fi
              exec /run.sh
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user, optional: true}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password, optional: true}}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/mrc/mrc-lab.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            # 起動時のプラグイン自動インストール/更新を止める (メモリを食って OOMKilled になった)
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_DATE_FORMATS_DEFAULT_TIMEZONE, value: browser}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/ds.yaml, subPath: datasources.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/db.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/mrc}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.mrclab.localhost
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: grafana, port: {name: http}}}}
